<html lang="{% if page and page.extra.lang %}{{ page.extra.lang }}{% else %}{{ config.default_language }}{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
<link rel="preload" as="font" type="font/woff2" href="{{ get_url(path='fonts/facade-sud-ouest.woff2') }}" crossorigin>
<link rel="stylesheet" href="{{ get_url(path='main.css') }}">
<link rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}">
<link rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="application/atom+xml" title="{{ config.title }} — atom feed" href="{{ get_url(path='atom.xml') }}">
<link rel="icon" href="data:,">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ get_url(path='/') }}">{{ config.title }}</a>
  <nav class="site-nav" aria-label="primary">
    <a href="{{ get_url(path='/posts') }}">POSTS</a>
    <a href="{{ get_url(path='/tags') }}">TAGS</a>
    <a href="{{ get_url(path='atom.xml') }}">FEED</a>
  </nav>
</header>
<main class="site-main">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <span class="copy" aria-label="copyright">©</span>
  <span class="year">{{ now() | date(format="%Y") }}</span>
  <span class="sep">·</span>
  <a href="{{ get_url(path='humans.txt') }}" title="who built this">¶</a>
</footer>
</body>
</html>
