<figure class="cap-img"{% if width %} style="max-width: {{ width }}"{% endif %}><input type="checkbox" id="cap-img-{{ page.slug | default(value='x') }}-{{ nth }}" class="cap-img-input"><label for="cap-img-{{ page.slug | default(value='x') }}-{{ nth }}" class="cap-img-label" title="click for caption"><img class="cap-img-media" src="{{ get_url(path=src) }}" alt="{{ alt | default(value='') }}" loading="lazy" decoding="async"><span class="cap-img-hint" aria-hidden="true">?</span></label><figcaption class="cap-img-caption"><label for="cap-img-{{ page.slug | default(value='x') }}-{{ nth }}" class="cap-img-close" title="hide caption" aria-label="hide caption">&times;</label><span class="cap-img-caption-text">{{ caption | safe }}</span></figcaption></figure>
