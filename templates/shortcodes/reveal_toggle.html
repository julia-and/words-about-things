<span class="reveal-toggle"><input type="checkbox" id="reveal-toggle-{{ page.slug | default(value='x') }}-{{ nth }}" class="reveal-toggle-input"><label for="reveal-toggle-{{ page.slug | default(value='x') }}-{{ nth }}" class="reveal-toggle-label"><span class="reveal-toggle-under" aria-hidden="true">{{ secret }}</span><span class="reveal-toggle-over">{{ text }}</span><span class="reveal-toggle-burst" aria-hidden="true">{% for i in range(end=8) %}<span class="reveal-toggle-petal" style="--angle: {{ i * 45 }}deg; animation-delay: {{ i * 18 }}ms">🌸</span>{% endfor %}</span></label></span>
